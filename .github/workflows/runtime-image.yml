name: runtime image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: See if a public image already matches
        id: choose
        run: |
          set -euo pipefail
          err=$(mktemp)
          set +e
          ref=$(scripts/runtime-image.sh select "$GITHUB_SHA" 2>"$err")
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            rm -f "$err"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A public image already matches: $ref"
          elif [[ -s "$err" ]]; then
            cat "$err" >&2
            rm -f "$err"
            exit 1
          else
            rm -f "$err"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to the container registry
        if: steps.choose.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the runtime image
        if: steps.choose.outputs.publish == 'true'
        run: |
          set -euo pipefail
          ref="ghcr.io/scott/castbot-runtime:${GITHUB_SHA}"
          docker build --platform linux/amd64 --target runtime \
            --label org.opencontainers.image.source=https://github.com/scott/castbot \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.title=castbot-runtime \
            -t "$ref" .
          docker push "$ref"
      - name: Make the package public
        if: steps.choose.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/castbot-runtime \
            -f visibility=public
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            printf 'visibility update returned %s\n' "$code" >&2
          fi
      - name: Confirm the tag is public
        if: steps.choose.outputs.publish == 'true'
        run: |
          set -euo pipefail
          want="ghcr.io/scott/castbot-runtime:${GITHUB_SHA}"
          ref=""
          for _ in 1 2 3 4 5 6; do
            if ref=$(scripts/runtime-image.sh select "$GITHUB_SHA"); then
              break
            fi
            ref=""
            sleep 10
          done
          [[ "$ref" == "$want" ]] || {
            printf 'public tag is %s\n' "${ref:-missing}" >&2
            exit 1
          }
