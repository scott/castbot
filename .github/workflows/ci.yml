name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: |
          go vet ./...
          go vet -tags shots ./...
      - name: images
        run: |
          docker build --target standin -t castbot-runtime:s03 .
          docker build -t castbot-runtime:s07 .
      - name: test
        run: go test -race -timeout 40m ./...
      - name: gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner

  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: chrome
        run: |
          ver=156.0.8078.47
          curl -fsSL -o /tmp/chrome.deb "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_${ver}-1_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades /tmp/chrome.deb
          google-chrome --version | grep -F "$ver"
      - name: shots
        run: go test -tags shots -count=1 -timeout 20m -run 'TestShots/(502|restart|error|container|machine|agentform|cli|s07|s07b|s09)' ./internal/web
